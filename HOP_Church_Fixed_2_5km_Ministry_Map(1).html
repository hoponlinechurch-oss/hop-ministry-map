<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H.O.P Church - Fixed 2.5 km Ministry Radius</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body,#map{height:100%;margin:0}
  .info{
    position:absolute;z-index:1000;top:12px;left:12px;
    background:#fff;padding:12px 14px;border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    font-family:Arial,sans-serif;font-size:14px;line-height:1.4
  }
  .info b{font-size:16px}
  .leaflet-control-attribution{font-size:10px}
</style>
</head>
<body>
<div id="map"></div>
<div class="info">
  <b>H.O.P Church Ministry Map</b><br>
  Fixed center: 12.98028, 80.25193<br>
  Fixed radius: <b>2.5 km</b><br>
  <span>Pan and zoom freely. The circle will always stay centered on the church.</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const church = [12.98028, 80.25193];

const map = L.map('map', {
  center: church,
  zoom: 14,
  zoomControl: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const churchIcon = L.divIcon({
  className: '',
  html: '<div style="width:30px;height:30px;border-radius:50%;background:#d00;border:3px solid white;box-shadow:0 1px 5px #555;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;">⛪</div>',
  iconSize: [30,30],
  iconAnchor: [15,15]
});

L.marker(church, {icon: churchIcon})
  .addTo(map)
  .bindPopup('<b>H.O.P Church</b><br>11, VSI Colony, 100 Feet Road, Taramani<br>Fixed ministry center');

L.circle(church, {
  radius: 2500,
  color: '#d00',
  weight: 3,
  fillColor: '#d00',
  fillOpacity: 0.08
}).addTo(map).bindPopup('<b>H.O.P Church 2.5 km Ministry Radius</b>');

map.fitBounds(L.circle(church, {radius:2500}).getBounds(), {padding:[20,20]});
</script>
</body>
</html>
